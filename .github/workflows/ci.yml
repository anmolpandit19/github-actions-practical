name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
env:
  APP_NAME: GitHub-Actions-App
  ENVIRONMENT: dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Application Information
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Build Application
        run: |
          echo "Building $APP_NAME"
          echo "Version: ${{ vars.APP_VERSION }}"

      - name: Check Secret
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available securely"
          else
            echo "Secret is NOT available"
            exit 1
          fi
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}

    test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run test
        run: echo "Test successful!"

      - name: PR validation
        if: github.event_name == 'pull_request'
        run: echo "This step runs only for Pull Requests"
