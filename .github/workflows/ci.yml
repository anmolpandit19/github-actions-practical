name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  APP_NAME: GitHub-Actions-App
  ENVIRONMENT: dev

jobs:

  # =========================
  # BUILD JOB
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Display Application Information
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"

      - name: Build Application
        run: |
          echo "Building $APP_NAME"
          echo "Version: ${{ vars.APP_VERSION }}"

      - name: Check GitHub Actions Secret
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "Secret is available securely"
          else
            echo "Secret is NOT available"
            exit 1
          fi


  # =========================
  # TEST JOB
  # =========================
  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Tests
        run: |
          echo "Testing $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "All tests passed!"

      - name: PR Validation
        if: github.event_name == 'pull_request'
        run: |
          echo "This step runs only for Pull Requests"
          echo "PR validation successful!"


  # =========================
  # DOCKER BUILD JOB
  # =========================
  docker-build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Version
        run: |
          docker --version

      - name: Build Docker Image
        run: |
          docker build -t github-actions-demo:1.0 .

      - name: Verify Docker Image
        run: |
          docker images

      - name: Test Docker Image
        run: |
          docker run -d --name github-actions-container -p 8080:80 github-actions-demo:1.0
          sleep 5
          curl http://localhost:8080

      - name: Stop Docker Container
        run: |
          docker stop github-actions-container
          docker rm github-actions-container
